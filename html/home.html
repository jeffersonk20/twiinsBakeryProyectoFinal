<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explora el catálogo de pasteles y postres de TWINS Bakery.">
    <title>TWINS Bakery | Catálogo</title>
    <link rel="stylesheet" href="{{ url_for('static_files', filename='css/home.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="catalog-header">
        <a class="brand" href="{{ url_for('inicio') }}">
            <img src="{{ url_for('static_files', filename='img/logo.png') }}" alt="TWINS Bakery">
            <span>TWINS <small>BAKERY</small></span>
        </a>
        <nav class="desktop-nav" aria-label="Navegación principal">
            <a href="{{ url_for('inicio') }}">Inicio</a>
            <a class="active" href="{{ url_for('catalogo') }}">Catálogo</a>
            <a href="{{ url_for('vitrina') }}">Vitrina</a>
            <a href="{{ url_for('mis_reservas') }}">Mis reservas</a>
            <a href="{{ url_for('admin_login') }}">Administración</a>
            <a href="{{ url_for('cerrar_sesion') }}">Cerrar sesión</a>
        </nav>
        <a class="account-link" href="{{ url_for('cerrar_sesion') }}">Cerrar sesión</a>
    </header>
    <main class="catalog-main">
        <div class="catalog-title">
            <div><p class="eyebrow">Encuentra algo delicioso</p><h1>Catálogo</h1></div>
            <p>Preparado artesanalmente para compartir.</p>
        </div>
        <div class="filters" role="group" aria-label="Filtrar por categoría" data-category-filters>
            <button class="filter active" type="button" data-category="Todos" aria-pressed="true">Todos</button>
            <button class="filter" type="button" data-category="Pasteles" aria-pressed="false">Pasteles</button>
            <button class="filter" type="button" data-category="Cupcakes" aria-pressed="false">Cupcakes</button>
            <button class="filter" type="button" data-category="Galletas" aria-pressed="false">Galletas</button>
            <button class="filter" type="button" data-category="Bebidas" aria-pressed="false">Bebidas</button>
        </div>
        <div class="product-grid" data-product-grid aria-live="polite"></div>
    </main>
    <nav class="mobile-nav" aria-label="Navegación móvil">
        <a href="{{ url_for('inicio') }}"><span aria-hidden="true">⌂</span>Inicio</a>
        <a class="selected" href="{{ url_for('catalogo') }}"><span aria-hidden="true">▦</span>Catálogo</a>
        <a href="{{ url_for('vitrina') }}"><span aria-hidden="true">✧</span>Vitrina</a>
        <a href="{{ url_for('mis_reservas') }}"><span aria-hidden="true">♡</span>Mis reservas</a>
        <a href="{{ url_for('admin_login') }}"><span aria-hidden="true">⚙</span>Admin</a>
        <a href="{{ url_for('cerrar_sesion') }}"><span aria-hidden="true">○</span>Salir</a>
    </nav>
    <script src="{{ url_for('static_files', filename='js/productos.js') }}" defer></script>
    <script src="{{ url_for('static_files', filename='js/catalogo.js') }}" defer></script>
</body>
</html>
