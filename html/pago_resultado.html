<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#153e49">
    <title>Confirmando pago | TWINS Bakery</title>
    <link rel="stylesheet" href="{{ url_for('static_files', filename='css/reservas.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="customer-header">
        <a class="customer-brand" href="{{ url_for('inicio') }}">TWINS <span>BAKERY</span></a>
        <nav aria-label="Navegación de cliente">
            <a href="{{ url_for('catalogo') }}">Catálogo</a>
            <a href="{{ url_for('mis_reservas') }}">Mis reservas</a>
        </nav>
    </header>
    <main class="reservation-page">
        <section class="confirmation-card" aria-labelledby="payment-result-title">
            <div class="success-icon pending-icon" aria-hidden="true">⌛</div>
            <p class="eyebrow">TWINS Bakery · Pago con Wompi</p>
            <h1 id="payment-result-title">Estamos confirmando tu pago</h1>
            <p>Gracias. Wompi está procesando la transacción; el estado de tu reserva se actualizará cuando recibamos su confirmación segura.</p>
            <div class="confirmation-actions">
                <a class="primary-button" href="{{ url_for('mis_reservas') }}">Ver mis reservas</a>
                <a class="outline-button" href="{{ url_for('catalogo') }}">Volver al catálogo</a>
            </div>
        </section>
    </main>
</body>
</html>
