<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TWINS Bakery - Iniciar Sesión</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- Pantalla del teléfono -->
    <div class="phone">

        <!-- Barra superior -->
        <div class="status-bar">

            <span class="time">9:41</span>

            <span class="wifi">
                ▮ &nbsp; Wi-Fi ▾
            </span>

        </div>

        <!-- Línea superior -->
        <div class="top-line"></div>


        <!-- Contenido principal -->
        <main class="content">

            <!-- LOGO -->
            <div class="logo">
                <img src="logo.png" alt="TWINS Bakery">
            </div>


            <!-- Título -->
            <h1>Endulzamos</h1>

            <h2>tus momentos especiales</h2>

            <p class="description">
                Postres, pasteles y más... con mucho amor.
            </p>


            <!-- FORMULARIO -->
            <form id="loginForm">

                <!-- Correo -->
                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                </div>


                <!-- Contraseña -->
                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••••••"
                            required
                        >

                        <button
                            type="button"
                            class="eye-button"
                            onclick="mostrarPassword()"
                            aria-label="Mostrar contraseña"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Recuperar contraseña -->
                <div class="forgot-container">

                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <!-- Botón iniciar sesión -->
                <button
                    type="submit"
                    class="login-button"
                >
                    Iniciar Sesión
                </button>

            </form>


            <!-- Registro -->
            <p class="register">

                ¿Aún no tienes cuenta?

                <a href="#">
                    Regístrate
                </a>

            </p>

        </main>

    </div>


    <!-- JavaScript -->
    <script>

        function mostrarPassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".eye-button");


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "🙈";

            } else {

                password.type = "password";

                button.textContent = "👁";

            }

        }


        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                alert("Inicio de sesión");

            });

    </script>

</body>

</html>
